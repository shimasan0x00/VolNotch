<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Amazon Appstore 掲載用アイコンの原本。
    app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml と同じ構成をストア用に再現している。
      背景 = @color/ic_launcher_background (#8BC4B1)
      前景 = drawable/ic_launcher_foreground.xml（原本は plan/ic_launcher_foreground.svg）
    アダプティブアイコンの 108 ビューポートのうち、マスク後に見える中央 72 相当を 512 に拡大するため、
    前景に transform="translate(-128,-128) scale(7.11111)" を掛けている（512/72 = 7.11111、18*7.11111 = 128）。
  -->
  <rect width="512" height="512" rx="112" ry="112" fill="#8BC4B1"/>
  <g transform="translate(-128,-128) scale(7.11111)">
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="44" y1="30" x2="44" y2="78"/>
      <line x1="60" y1="32" x2="76" y2="32"/>
      <line x1="60" y1="50" x2="76" y2="50"/>
      <line x1="60" y1="60" x2="70" y2="60"/>
      <line x1="60" y1="70" x2="70" y2="70"/>
    </g>
    <rect x="32" y="60" width="24" height="11" rx="5.5" fill="#FFFFFF"/>
  </g>
</svg>
